[project]
name = "mm_loopback"
version = "0.1.0"
default_backend = "xsim"

[parameters]
N = 1024

[backend.xsim]
# Set this to your own Vivado install path (e.g. /opt/Xilinx/Vivado/<version>).
# No Vivado? The verilator backend needs none: `vten run --backend verilator` (Verilator >= 5.0).
vivado_path = "/tools/Xilinx/Vivado/2023.2"
part = "xcu250-figd2104-2L-e"
compile_options = ["-timescale", "1ns/1ps"]
timeout_ms = 30000
submit_timeout_s = 300

[backend.verilator]
threads = 4
trace = false

[backend.xrt]
xclbin_path = "kernels/mm_loopback/build/xrt/mm_loopback_hw_emu.xclbin"
device_index = 0
kernel_name = "mm_loopback"
poll_timeout_ms = 300000
platform = "/opt/xilinx/platforms/xilinx_u280_gen3x16_xdma_1_202211_1/xilinx_u280_gen3x16_xdma_1_202211_1.xpfm"
part = "xcu280-fsvh2892-2L-e"
target = "hw_emu"

[rtl]
sources = ["rtl/*.sv"]

[test]
default_seed = 42
waveform = false
waveform_on_fail = true
