kernel: offset
rtl_top: rtl/offset_core.sv

runtime_params:
  offset_value:
    default: 1
    register: ctrl.offset_value
  length:
    register: ctrl.length

interfaces:
  ctrl:
    rtl_port: s_axilite
    protocol: axi4_lite
    addr_width: 16
    data_width: 32
    generate_controller: true
    registers:
      - name: offset_value
        offset: 0x00
        access: rw
        width: 8          # raw uint8 code, reinterpreted two's-complement by
                          # the RTL ($signed(reg)) — e.g. 251 means -5
      - name: length
        offset: 0x04
        access: rw
      - name: ctrl
        offset: 0x08
        access: rw
        pulse: true
        fields: { start: "0:0" }
      - name: status
        offset: 0x0C
        access: ro
        fields: { done: "0:0" }

  input_stream:
    rtl_port: s_axis
    protocol: axi4_stream
    tensor: data_in
    packing:
      element_width: 8
      elements_per_beat: 32
      bit_order: lsb_first
    quant:            # int8 integer codes (Q-format, frac_bits=0)
      bits: 8
      signed: true
      frac_bits: 0

  output_stream:
    rtl_port: m_axis
    protocol: axi4_stream
    tensor: data_out
    packing:
      element_width: 8
      elements_per_beat: 32
      bit_order: lsb_first
    quant:            # widened int9 sum is CLAMPED back to [-128, 127]
      bits: 8
      signed: true
      frac_bits: 0
      overflow: saturate
