kernel: scale
rtl_top: rtl/scale_core.sv

runtime_params:
  scale_factor:
    default: 2
    register: ctrl.scale_factor
  length:
    register: ctrl.length

interfaces:
  ctrl:
    rtl_port: s_axilite
    protocol: axi4_lite
    addr_width: 16
    data_width: 32
    generate_controller: true
    registers:
      - name: scale_factor
        offset: 0x00
        access: rw
        width: 8          # UNSIGNED 8-bit multiplier (RTL: $signed({1'b0, reg}))
      - name: length
        offset: 0x04
        access: rw
      - name: ctrl
        offset: 0x08
        access: rw
        pulse: true
        fields: { start: "0:0" }
      - name: status
        offset: 0x0C
        access: ro
        fields: { done: "0:0" }

  input_stream:
    rtl_port: s_axis
    protocol: axi4_stream
    tensor: data_in
    packing:
      element_width: 8
      elements_per_beat: 32
      bit_order: lsb_first
    quant:            # int8 integer codes (Q-format, frac_bits=0)
      bits: 8
      signed: true
      frac_bits: 0

  output_stream:
    rtl_port: m_axis
    protocol: axi4_stream
    tensor: data_out
    packing:
      element_width: 8
      elements_per_beat: 32
      bit_order: lsb_first
    quant:            # widened int16 product is CLAMPED back to [-128, 127]
      bits: 8
      signed: true
      frac_bits: 0
      overflow: saturate
