kernel: int16_x1
rtl_top: rtl/passthrough_16.sv

interfaces:
  input_stream:
    rtl_port: s_axis
    protocol: axi4_stream
    data_width: 16
    tensor: data_in
    packing:
      element_width: 16
      elements_per_beat: 1
      bit_order: lsb_first

  output_stream:
    rtl_port: m_axis
    protocol: axi4_stream
    data_width: 16
    tensor: data_out
    packing:
      element_width: 16
      elements_per_beat: 1
      bit_order: lsb_first
