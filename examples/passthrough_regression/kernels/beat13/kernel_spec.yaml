kernel: beat13
rtl_top: rtl/passthrough_104.sv

interfaces:
  input_stream:
    rtl_port: s_axis
    protocol: axi4_stream
    data_width: 104
    tensor: data_in
    packing:
      element_width: 8
      elements_per_beat: 13
      bit_order: lsb_first

  output_stream:
    rtl_port: m_axis
