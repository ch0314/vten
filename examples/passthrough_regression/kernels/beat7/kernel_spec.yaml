kernel: beat7
rtl_top: rtl/passthrough_56.sv

interfaces:
  input_stream:
    rtl_port: s_axis
    protocol: axi4_stream
    data_width: 56
    tensor: data_in
    packing:
      element_width: 8
      elements_per_beat: 7
      bit_order: lsb_first

  output_stream:
    rtl_port: m_axis
    protocol: axi4_stream
    data_width: 56
    tensor: data_out
    packing:
      element_width: 8
      elements_per_beat: 7
      bit_order: lsb_first
