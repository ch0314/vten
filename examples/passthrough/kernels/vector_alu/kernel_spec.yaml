kernel: vector_alu
rtl_top: rtl/vector_alu_core.sv

runtime_params:
  op_mode:
    default: 0
    register: ctrl.op_mode

memory_regions:
  ddr:
    base: 0x10000000
    size: 0x10000000
    alignment: 4096

interfaces:
  ctrl:
    rtl_port: s_axilite
    protocol: axi4_lite
    addr_width: 16
    data_width: 32
    generate_controller: true
    registers:
      - name: src_a_addr_lo
        offset: 0x00
        access: rw
        auto_bind: { tensor: operand_a, value: address, bits: "31:0" }
      - name: src_a_addr_hi
        offset: 0x04
        access: rw
        auto_bind: { tensor: operand_a, value: address, bits: "63:32" }
      - name: src_b_addr_lo
        offset: 0x08
        access: rw
        auto_bind: { tensor: operand_b, value: address, bits: "31:0" }
      - name: src_b_addr_hi
        offset: 0x0C
        access: rw
        auto_bind: { tensor: operand_b, value: address, bits: "63:32" }
      - name: dst_addr_lo
        offset: 0x10
        access: rw
        auto_bind: { tensor: result, value: address, bits: "31:0" }
      - name: dst_addr_hi
        offset: 0x14
        access: rw
        auto_bind: { tensor: result, value: address, bits: "63:32" }
      - name: length
        offset: 0x18
        access: rw
        auto_bind: { tensor: operand_a, value: size_beats }
      - name: op_mode
        offset: 0x1C
        access: rw
      - name: ctrl
        offset: 0x20
        access: rw
        pulse: true
        fields: { start: "0:0" }
      - name: status
        offset: 0x24
        access: ro
        fields: { done: "0:0" }

  mem_port:
    rtl_port: m_axi
    protocol: axi4
    data_width: 256
    addr_width: 64
    memory_region: ddr
    tensors: [operand_a, operand_b, result]
    packing:
      element_width: 8
      elements_per_beat: 32
      bit_order: lsb_first
