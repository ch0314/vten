kernel: int32_x2
rtl_top: rtl/passthrough_64.sv

interfaces:
  input_stream:
    rtl_port: s_axis
    protocol: axi4_stream
    data_width: 64
    tensor: data_in
    packing:
      element_width: 32
      elements_per_beat: 2
      bit_order: lsb_first

  output_stream:
    rtl_port: m_axis
    protocol: axi4_stream
    data_width: 64
    tensor: data_out
    packing:
      element_width: 32
      elements_per_beat: 2
      bit_order: lsb_first
