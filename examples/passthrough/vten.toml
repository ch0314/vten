[project]
name = "passthrough"
version = "0.1.0"

[parameters]
N = 1024

[backend.xsim]
vivado_path = "/tools/Xilinx/Vivado/2023.2"
timeout_ms = 10000
submit_timeout_s = 300

[rtl]
sources = ["rtl/**/*.sv", "rtl/**/*.v"]
top_module = "passthrough"
