# kernel_spec.yaml — NPU_3D 3D Convolution Accelerator
#
# RTL: ~/xhw/projects/npu/src/NPU_3D/design/top_wrapper/rtl/NPU_3D_top.sv
# Analysis: specs/npu_3d_analysis.md
#
# 6개 IP 커널이 개별 AXI4-Lite로 제어되며,
# DDR 2포트 + HBM 32포트의 AXI4 master를 가진다.

kernel: npu_3d
rtl_top: ~/xhw/projects/npu/src/NPU_3D/design/top_wrapper/rtl/NPU_3D_top.sv

parameters:
  # Runtime parameters (resolved at instantiate)
  IN_DEPTH:   "${IN_DEPTH}"
  IN_HEIGHT:  "${IN_HEIGHT}"
  IN_WIDTH:   "${IN_WIDTH}"
  IN_CH:      "${IN_CH}"
  OUT_CH:     "${OUT_CH}"
  KERNEL_SIZE: "${KERNEL_SIZE}"       # 1, 2, or 3
  IFM_STRIDE:  "${IFM_STRIDE}"       # 1 or 2
  OFM_STRIDE:  "${OFM_STRIDE}"       # 1 or 2
  IS_RELU:     "${IS_RELU}"          # 0 or 1
  IS_PADDING:  "${IS_PADDING}"       # 0 or 1
  IS_CONCAT:   "${IS_CONCAT}"        # 0 or 1
  CONCAT_CH:   "${CONCAT_CH}"        # 0 if no concat
  BIAS_SHIFT:  "${BIAS_SHIFT}"       # 0-31
  IFM_DTYPE:   "${IFM_DTYPE}"        # 0=uint8, 1=int8
  SCALE_SHIFT: "${SCALE_SHIFT}"      # 0-31
  # Fixed hardware parameters
  Ti: 32
  To: 32
  OUT_GROUP: 2

memory_regions:
  ddr:
    base: 0x0000_0000
    size: 0x1_0000_0000          # 4GB
    alignment: 4096
  hbm:
    base: 0x0000_0000
    size: 0x1_0000_0000          # per-bank
    alignment: 4096

interfaces:
  # ─── DDR AXI4 Master (IFM/OFM/Bias) ───────────────────────────
  ddr0:
    rtl_port: ddr_m00_axi
    protocol: axi4
    data_width: 256
    addr_width: 64
    memory_region: ddr
    tensors: [ifm, ofm, concat]
    packing:
      element_width: 8
      elements_per_beat: 32        # 256 / 8
      alignment: packed

  ddr1:
    rtl_port: ddr_m01_axi
    protocol: axi4
    data_width: 256
    addr_width: 64
    memory_region: ddr
    tensor: bias
    packing:
      element_width: 32           # bias is int32
      elements_per_beat: 8         # 256 / 32
      alignment: packed

  # ─── HBM AXI4 Master (Weights, 32 banks) ──────────────────────
  hbm:
    rtl_port: hbm_m{i:02d}_axi
    protocol: axi4
    data_width: 256
    addr_width: 64
    memory_region: hbm
    tensor: weight
    packing:
      element_width: 8
      elements_per_beat: 32
      alignment: packed
    split:
      mode: channel_interleave
      ports:
        - { name: hbm_m00_axi, base_addr: 0x00000000 }
        - { name: hbm_m01_axi, base_addr: 0x00000000 }
        - { name: hbm_m02_axi, base_addr: 0x00000000 }
        - { name: hbm_m03_axi, base_addr: 0x00000000 }
        - { name: hbm_m04_axi, base_addr: 0x00000000 }
        - { name: hbm_m05_axi, base_addr: 0x00000000 }
        - { name: hbm_m06_axi, base_addr: 0x00000000 }
        - { name: hbm_m07_axi, base_addr: 0x00000000 }
        - { name: hbm_m08_axi, base_addr: 0x00000000 }
        - { name: hbm_m09_axi, base_addr: 0x00000000 }
        - { name: hbm_m10_axi, base_addr: 0x00000000 }
        - { name: hbm_m11_axi, base_addr: 0x00000000 }
        - { name: hbm_m12_axi, base_addr: 0x00000000 }
        - { name: hbm_m13_axi, base_addr: 0x00000000 }
        - { name: hbm_m14_axi, base_addr: 0x00000000 }
        - { name: hbm_m15_axi, base_addr: 0x00000000 }
        - { name: hbm_m16_axi, base_addr: 0x00000000 }
        - { name: hbm_m17_axi, base_addr: 0x00000000 }
        - { name: hbm_m18_axi, base_addr: 0x00000000 }
        - { name: hbm_m19_axi, base_addr: 0x00000000 }
        - { name: hbm_m20_axi, base_addr: 0x00000000 }
        - { name: hbm_m21_axi, base_addr: 0x00000000 }
        - { name: hbm_m22_axi, base_addr: 0x00000000 }
        - { name: hbm_m23_axi, base_addr: 0x00000000 }
        - { name: hbm_m24_axi, base_addr: 0x00000000 }
        - { name: hbm_m25_axi, base_addr: 0x00000000 }
        - { name: hbm_m26_axi, base_addr: 0x00000000 }
        - { name: hbm_m27_axi, base_addr: 0x00000000 }
        - { name: hbm_m28_axi, base_addr: 0x00000000 }
        - { name: hbm_m29_axi, base_addr: 0x00000000 }
        - { name: hbm_m30_axi, base_addr: 0x00000000 }
        - { name: hbm_m31_axi, base_addr: 0x00000000 }

  # ─── AXI4-Lite Slave: bias_loader ──────────────────────────────
  ctrl_bias_loader:
    rtl_port: s_axilite_bias_loader
    protocol: axi4_lite
    addr_width: 16
    registers:
      - name: bias_addr_lsb
        offset: 0x010
        auto_bind: { tensor: bias, value: address, bits: "31:0" }
      - name: bias_addr_msb
        offset: 0x014
        auto_bind: { tensor: bias, value: address, bits: "63:32" }
      - name: out_ch
        offset: 0x018
        auto_bind: { param: "${OUT_CH}" }
      - name: vsync
        offset: 0x01C
        fields: { trigger: "0:0" }

  # ─── AXI4-Lite Slave: act_quant ────────────────────────────────
  ctrl_act_quant:
    rtl_port: s_axilite_act_quant
    protocol: axi4_lite
    addr_width: 16
    registers:
      - name: in_depth
        offset: 0x014
        auto_bind: { param: "${IN_DEPTH}" }
      - name: in_height
        offset: 0x018
        auto_bind: { param: "${IN_HEIGHT}" }
      - name: in_width
        offset: 0x01C
        auto_bind: { param: "${IN_WIDTH}" }
      - name: out_ch
        offset: 0x020
        auto_bind: { param: "${OUT_CH}" }
      - name: bias_shift
        offset: 0x024
        auto_bind: { param: "${BIAS_SHIFT}" }
      - name: is_relu
        offset: 0x028
        auto_bind: { param: "${IS_RELU}" }
      - name: ifm_stride
        offset: 0x02C
        auto_bind: { param: "${IFM_STRIDE}" }
      - name: ofm_stride
        offset: 0x030
        auto_bind: { param: "${OFM_STRIDE}" }
      - name: vsync
        offset: 0x034
        fields: { trigger: "0:0" }

  # ─── AXI4-Lite Slave: psum_buffer ──────────────────────────────
  ctrl_psum_buffer:
    rtl_port: s_axilite_psum_buffer
    protocol: axi4_lite
    addr_width: 16
    registers:
      - name: in_ch
        offset: 0x010
        auto_bind: { param: "${IN_CH}" }
      - name: out_ch
        offset: 0x014
        auto_bind: { param: "${OUT_CH}" }
      - name: in_width
        offset: 0x018
        auto_bind: { param: "${IN_WIDTH}" }
      - name: in_height
        offset: 0x01C
        auto_bind: { param: "${IN_HEIGHT}" }
      - name: in_depth
        offset: 0x020
        auto_bind: { param: "${IN_DEPTH}" }
      - name: vsync
        offset: 0x024
        fields: { trigger: "0:0" }
      - name: kernel_size
        offset: 0x028
        auto_bind: { param: "${KERNEL_SIZE}" }
      - name: ifm_stride
        offset: 0x02C
        auto_bind: { param: "${IFM_STRIDE}" }
      - name: ofm_stride
        offset: 0x030
        auto_bind: { param: "${OFM_STRIDE}" }

  # ─── AXI4-Lite Slave: weight_loader ────────────────────────────
  ctrl_weight_loader:
    rtl_port: s_axilite_weight_loader
    protocol: axi4_lite
    addr_width: 16
    registers:
      - name: in_width
        offset: 0x010
        auto_bind: { param: "${IN_WIDTH}" }
      - name: in_height
        offset: 0x014
        auto_bind: { param: "${IN_HEIGHT}" }
      - name: in_depth
        offset: 0x018
        auto_bind: { param: "${IN_DEPTH}" }
      # weight_addr[0..31] — 32 banks, each LSB/MSB pair
      # Offsets: 0x01C + 8*i (LSB), 0x020 + 8*i (MSB)
      - name: weight_addr_00_lsb
        offset: 0x01C
        auto_bind: { expr: "hbm_bank_addr(0, 31, 0)" }
      - name: weight_addr_00_msb
        offset: 0x020
        auto_bind: { expr: "hbm_bank_addr(0, 63, 32)" }
      # ... (remaining banks handled programmatically in kernel)
      - name: vsync
        offset: 0x11C
        fields: { trigger: "0:0" }
      - name: kernel_size
        offset: 0x120
        auto_bind: { param: "${KERNEL_SIZE}" }
      - name: in_ch
        offset: 0x124
        auto_bind: { param: "${IN_CH}" }
      - name: out_ch
        offset: 0x128
        auto_bind: { param: "${OUT_CH}" }

  # ─── AXI4-Lite Slave: mac_atu ──────────────────────────────────
  ctrl_mac_atu:
    rtl_port: s_axilite_mac_atu
    protocol: axi4_lite
    addr_width: 16
    registers:
      - name: ifm_is_signed
        offset: 0x010
        auto_bind: { param: "${IFM_DTYPE}" }
      - name: in_ch
        offset: 0x014
        auto_bind: { param: "${IN_CH}" }
      - name: out_ch
        offset: 0x018
        auto_bind: { param: "${OUT_CH}" }
      - name: is_concat
        offset: 0x01C
        auto_bind: { param: "${IS_CONCAT}" }
      - name: concat_is_signed
        offset: 0x020
        auto_bind: { param: "${IFM_DTYPE}" }
      - name: concat_ch
        offset: 0x024
        auto_bind: { param: "${CONCAT_CH}" }
      - name: in_width
        offset: 0x028
        auto_bind: { param: "${IN_WIDTH}" }
      - name: in_height
        offset: 0x02C
        auto_bind: { param: "${IN_HEIGHT}" }

  # ─── AXI4-Lite Slave: fmapIO ──────────────────────────────────
  ctrl_fmapio:
    rtl_port: s_axilite_fmapio
    protocol: axi4_lite
    addr_width: 16
    registers:
      - name: in_depth
        offset: 0x014
        auto_bind: { param: "${IN_DEPTH}" }
      - name: in_height
        offset: 0x018
        auto_bind: { param: "${IN_HEIGHT}" }
      - name: in_width
        offset: 0x01C
        auto_bind: { param: "${IN_WIDTH}" }
      - name: in_ch
        offset: 0x020
        auto_bind: { param: "${IN_CH}" }
      - name: out_ch
        offset: 0x024
        auto_bind: { param: "${OUT_CH}" }
      - name: ifm_stride
        offset: 0x028
        auto_bind: { param: "${IFM_STRIDE}" }
      - name: ofm_stride
        offset: 0x02C
        auto_bind: { param: "${OFM_STRIDE}" }
      - name: is_concat
        offset: 0x030
        auto_bind: { param: "${IS_CONCAT}" }
      - name: concat_ch
        offset: 0x034
        auto_bind: { param: "${CONCAT_CH}" }
      - name: ifm_addr_lsb
        offset: 0x038
        auto_bind: { tensor: ifm, value: address, bits: "31:0" }
      - name: ifm_addr_msb
        offset: 0x03C
        auto_bind: { tensor: ifm, value: address, bits: "63:32" }
      - name: ofm_addr_lsb
        offset: 0x040
        auto_bind: { tensor: ofm, value: address, bits: "31:0" }
      - name: ofm_addr_msb
        offset: 0x044
        auto_bind: { tensor: ofm, value: address, bits: "63:32" }
      - name: concat_addr_lsb
        offset: 0x048
        auto_bind: { tensor: concat, value: address, bits: "31:0" }
      - name: concat_addr_msb
        offset: 0x04C
        auto_bind: { tensor: concat, value: address, bits: "63:32" }
      - name: vsync
        offset: 0x050
        fields: { trigger: "0:0" }
      - name: layer_done
        offset: 0x054
        fields: { done: "0:0" }
