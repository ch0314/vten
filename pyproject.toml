[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vten"
version = "0.1.0"
description = "Tensor-centric verification framework for DSA"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
xrt = [
    "pybind11>=2.11",
]

[project.scripts]
vten = "vten.cli.main:main"

[tool.setuptools.packages.find]
include = ["vten*"]

[tool.setuptools.package-data]
vten = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "xsim: requires xsim (Vivado simulator) for E2E execution",
]