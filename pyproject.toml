[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vten"
version = "0.1.0"
description = "Tensor-centric verification framework for DSA"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/ch0314/vten"
Repository = "https://github.com/ch0314/vten"
"Bug Tracker" = "https://github.com/ch0314/vten/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
xrt = [
    "pybind11>=2.11",
]

[project.scripts]
vten = "vten.cli.main:main"

[tool.setuptools.packages.find]
include = ["vten*"]

[tool.setuptools.package-data]
vten = ["templates/**/*", "sv/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "xsim: requires xsim (Vivado simulator) for E2E execution",
]